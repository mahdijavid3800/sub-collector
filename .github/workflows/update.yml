name: Update Subscription Configs

on:
  schedule:
    - cron: '0 */6 * * *' # هر ۶ ساعت یکبار اجرا می‌شود
  workflow_dispatch: # امکان اجرای دستی

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # این خط برای اجازه پوش کردن لازم است

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Collector Script
        env:
          SUB_URLS: ${{ secrets.SUB_URLS }}
        run: python collector.py

      - name: Remove old individual files
        run: |
          # حذف فایل‌های اضافی تولید شده توسط کد قبلی
          rm -f final_sub[0-9].txt
          rm -f javidsub[0-9]

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add -A
          
          git commit -m "Update subscription: single valid JSON config file" || echo "No changes to commit"
          git push
